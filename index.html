<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign Up Form</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="whole_page">
            <div id="image"></div>
            <div id="sign-form">
                <div id="heading">
                    <div id="header"></div>
                    <div id="info"></div>
                </div>
                <div id="fields">
                    <div id="first-col">
                        <div id="first-name-field"></div>
                        <div id="email-field"></div>
                        <div id="password-field"></div>
                    </div>
                    <div id="second-col">
                        <div id="last-name-field"></div>
                        <div id="phone-num-field"></div>
                        <div id="confirm-pass-field"></div>
                    </div>
                </div>
                <div id="create-account-button"></div>
                <div id="log-in-link"></div>
            </div>
        </div>
    </body>
</html>
